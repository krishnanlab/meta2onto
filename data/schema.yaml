  /api/study/search/:
    get:
      operationId: study_search_retrieve
      description: |-
        ReadOnly API endpoint for viewing GEOSeries.
        Accessible at /api/series/
      parameters:
      - in: query
        name: Classification
        schema:
          type: array
          items:
            type: string
        description: Filter by one or more training classifications
      - in: query
        name: Confidence
        schema:
          type: string
        description: Filter by confidence bucket (high, medium, low, unknown) or a
          range like '70-90'
      - in: query
        name: Databases
        schema:
          type: array
          items:
            type: string
        description: Filter by one or more source databases
      - in: query
        name: Organisms
        schema:
          type: array
          items:
            type: string
        description: Filter by one or more organisms
      - in: query
        name: Platforms
        schema:
          type: array
          items:
            type: string
        description: Filter by one or more platform (GPL) ids
      - in: query
        name: Study Size
        schema:
          type: string
        description: Filter by study size bucket (small, medium, large) or a range
          like '10-50'
      - in: query
        name: Technologies
        schema:
          type: array
          items:
            type: string
        description: Filter by one or more technologies
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of results to return per page
      - in: query
        name: offset
        schema:
          type: integer
        description: The initial index from which to return the results
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -date
          - -relevance
          - -samples
          - date
          - relevance
          - samples
        description: Field to order results by
      - in: query
        name: query
        schema:
          type: string
        description: Ontology term ID to search studies for, e.g. MONDO:0007254
        required: true
      tags:
      - study
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GEOSeriesSearchResponse'
          description: ''
components:
  schemas:
    Cart:
      type: object
      description: Serializer for Cart model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        studies:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
      required:
      - id
      - name
      - studies
    CartCreateRequest:
      type: object
      description: Request body for POST /api/cart/.
      properties:
        name:
          type: string
        studies:
          type: array
          items:
            $ref: '#/components/schemas/CartItemCreateRequest'
      required:
      - name
    CartItem:
      type: object
      description: Serializer for CartItem model.
      properties:
        id:
          type: string
          readOnly: true
        search:
          type: string
          readOnly: true
        term:
          type: string
          readOnly: true
        added:
          type: string
          format: date-time
          readOnly: true
      required:
      - added
      - id
      - search
      - term
    CartItemCreateRequest:
      type: object
      description: A single study entry provided when creating a shared cart.
      properties:
        id:
          type: string
          description: GSE id of the study
        search:
          type: string
        term:
          type: string
        added:
          type: string
          format: date-time
          nullable: true
      required:
      - id
    DatabaseStats:
      type: object
      description: Serializer for database statistics returned from /api/stats/ endpoint.
      properties:
        tissues:
          type: integer
        diseases:
          type: integer
        studies:
          type: integer
        samples:
          type: integer
        species:
          type: integer
        technologies:
          type: integer
        feedback:
          type: integer
      required:
      - diseases
      - feedback
      - samples
      - species
      - studies
      - technologies
      - tissues
    GEOPlatform:
      type: object
      description: Serializer for GEOPlatform model.
      properties:
        gpl:
          type: string
        title:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        submission_date:
          type: string
          nullable: true
        last_update_date:
          type: string
          nullable: true
        technology:
          type: string
          nullable: true
        distribution:
          type: string
          nullable: true
        organism:
          type: string
          nullable: true
        manufacturer:
          type: string
          nullable: true
        manufacture_protocol:
          type: string
          nullable: true
        coating:
          type: string
          nullable: true
        catalog_number:
          type: string
          nullable: true
        support:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        web_link:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        data_row_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        supplementary_file:
          type: string
          nullable: true
        bioc_package:
          type: string
          nullable: true
      required:
      - gpl
    GEOSample:
      type: object
      description: Serializer for GEOSample model.
      properties:
        gsm:
          type: string
          description: GEOSample ID
        id:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        gpl_raw:
          type: string
          nullable: true
          description: GEOPlatform ID
        status:
          type: string
          nullable: true
        submission_date:
          type: string
          nullable: true
        last_update_date:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        source_name_ch1:
          type: string
          nullable: true
        organism_ch1:
          type: string
          nullable: true
        characteristics_ch1:
          type: string
          nullable: true
        molecule_ch1:
          type: string
          nullable: true
        label_ch1:
          type: string
          nullable: true
        treatment_protocol_ch1:
          type: string
          nullable: true
        extract_protocol_ch1:
          type: string
          nullable: true
        label_protocol_ch1:
          type: string
          nullable: true
        source_name_ch2:
          type: string
          nullable: true
        organism_ch2:
          type: string
          nullable: true
        characteristics_ch2:
          type: string
          nullable: true
        molecule_ch2:
          type: string
          nullable: true
        label_ch2:
          type: string
          nullable: true
        treatment_protocol_ch2:
          type: string
          nullable: true
        extract_protocol_ch2:
          type: string
          nullable: true
        label_protocol_ch2:
          type: string
          nullable: true
        hyb_protocol:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        data_processing:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        supplementary_file:
          type: string
          nullable: true
        data_row_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        channel_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        doc:
          type: string
          nullable: true
        series_set:
          type: array
          items:
            type: string
          nullable: true
          description: List of GSE IDs this sample belongs to
        series:
          type: string
          nullable: true
      required:
      - gsm
      - id
    GEOSampleSearchResponse:
      type: object
      description: Response shape for GET /api/study/{gse}/samples/.
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GEOSample'
      required:
      - count
      - next
      - previous
      - results
    GEOSeries:
      type: object
      description: Serializer for GEOSeries model.
      properties:
        name:
          type: string
          readOnly: true
        id:
          type: string
          readOnly: true
        status:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date
          readOnly: true
        last_update_date:
          type: string
          nullable: true
        pubmed_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        summary:
          type: string
          nullable: true
        description:
          type: string
          readOnly: true
        type:
          type: string
          nullable: true
        contributor:
          type: string
          nullable: true
        web_link:
          type: string
          nullable: true
        overall_design:
          type: string
          nullable: true
        repeats:
          type: string
          nullable: true
        repeats_sample_list:
          type: string
          nullable: true
        variable:
          type: string
          nullable: true
        variable_description:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        supplementary_file:
          type: string
          nullable: true
        confidence:
          type: object
          description: Compute confidence level based on prob.
          properties:
            name:
              type: string
            value:
              type: number
              format: double
              nullable: true
          required:
          - name
          - value
          readOnly: true
        sample_count:
          type: integer
          description: Get the number of samples associated with this series.
          readOnly: true
        database:
          type: object
          additionalProperties:
            type: object
            description: Info about where a study is hosted in a particular external
              database.
            properties:
              url:
                type: string
                nullable: true
              external_id:
                type: string
                nullable: true
          readOnly: true
        platform:
          type: array
          items:
            type: string
          nullable: true
          description: Get the platform name associated with this series.
          readOnly: true
        organisms:
          type: array
          items:
            type: string
          readOnly: true
        keywords:
          type: array
          items:
            type: string
          description: Extract keywords from the series summary.
          readOnly: true
        classification:
          type: string
          readOnly: true
        feedback:
          type: object
          description: |-
            Returns aggregate rating and number of votes for this series.

            In the Feedback model, "likes" have a rating of 1 and "dislikes" have a rating of -1.
          properties:
            vote_count:
              type: integer
            likes:
              type: integer
            dislikes:
              type: integer
          required:
          - dislikes
          - likes
          - vote_count
          readOnly: true
      required:
      - classification
      - confidence
      - database
      - description
      - feedback
      - id
      - keywords
      - name
      - organisms
      - platform
      - sample_count
      - submitted_at
    GEOSeriesSearchResponse:
      type: object
      description: |-
        Response shape produced by GEOSeriesSearchPagination, used by
        GEOSeriesViewSet's list/search/lookup actions.
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GEOSeries'
        facets:
          type: object
          additionalProperties:
            oneOf:
            - type: object
              additionalProperties:
                type: integer
            - type: object
              description: A facet whose values form a continuous numeric range (e.g.
                a slider).
              properties:
                label:
                  type: string
                min:
                  type: integer
                max:
                  type: integer
              required:
              - label
              - max
              - min
          readOnly: true
        meta:
          type: object
          description: Metadata about the ontology term a study search was performed
            for.
          properties:
            term:
              type: string
            name:
              type: string
            type:
              type: string
            performance:
              type: string
          required:
          - name
          - performance
          - term
          - type
          readOnly: true
      required:
      - count
      - facets
      - meta
      - next
      - previous
      - results
