# -----------------------------
# PostgreSQL production configuration
# -----------------------------
#
# Safe baseline for running a site on a GCP e2-medium:
#   - 2 vCPU
#   - 4 GB RAM
#
# Assumptions:
#   - PostgreSQL is on the same VM as the app/site, or the VM is otherwise small.
#   - Database is around 10GB+ with some large tables.
#   - Storage is persistent disk, ideally SSD / balanced PD.
#   - This is for serving traffic safely, not for fastest possible pg_restore.

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------

# Keep this modest on 4GB RAM. Prefer PgBouncer if the app opens many connections.
max_connections = 50

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

# Conservative for a 4GB VM, leaving room for OS, filesystem cache, app, and workers.
shared_buffers = 768MB

# Planner estimate of OS + PostgreSQL cache available.
# Use 2GB if the app is on the same VM and memory is tight.
effective_cache_size = 2GB

# This is per sort/hash operation, per query node, per connection.
# Do not set this high on a small instance.
work_mem = 4MB

# Used for VACUUM, CREATE INDEX, ALTER TABLE ADD FK validation, etc.
# 256MB is safer for production than 512MB on a 4GB VM.
maintenance_work_mem = 256MB

# Lets autovacuum workers use a reasonable amount without stealing too much RAM.
autovacuum_work_mem = 128MB

#------------------------------------------------------------------------------
# BACKGROUND WORKERS / PARALLELISM
#------------------------------------------------------------------------------

# e2-medium only has 2 vCPU-class cores, so keep parallelism restrained.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG / DURABILITY
#------------------------------------------------------------------------------

# Production-safe durability.
fsync = on
synchronous_commit = on
full_page_writes = on

# Use replica unless you are absolutely certain you will never use physical
# backups, WAL archiving, replicas, PITR, or tooling that expects normal WAL.
wal_level = replica

# Safe and often helpful when WAL volume is high.
wal_compression = on

# Prefer defaults / normal behavior in production.
wal_init_zero = on
wal_recycle = on

#------------------------------------------------------------------------------
# CHECKPOINTS / WAL SIZING
#------------------------------------------------------------------------------

# Larger than PostgreSQL defaults to reduce checkpoint pressure during write bursts,
# index builds, and large table changes, but not absurdly large for a small VM.
max_wal_size = 8GB
min_wal_size = 1GB

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Reasonable on Linux. If you are on slow standard persistent disk, consider 256kB-1MB.
checkpoint_flush_after = 1MB

# Keep warnings enabled; they are useful if checkpoints happen too frequently.
checkpoint_warning = 30s

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

# Must be on for a live site.
autovacuum = on

# Big tables need autovacuum to start before bloat gets ugly.
# These defaults are still gentle, but better than stock for large tables.
autovacuum_max_workers = 3
autovacuum_naptime = 30s

autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Avoid aggressive IO spikes on a tiny VM.
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 5ms

#------------------------------------------------------------------------------
# IO / STORAGE
#------------------------------------------------------------------------------

# Good defaults if using SSD or balanced persistent disk.
# For standard spinning-style persistent disk, reduce these substantially.
effective_io_concurrency = 64
maintenance_io_concurrency = 32

# Optional, usually reasonable for SSD/balanced PD.
# Leave commented if you prefer PostgreSQL defaults.
# random_page_cost = 1.1
# seq_page_cost = 1.0

#------------------------------------------------------------------------------
# QUERY PLANNER / STATISTICS
#------------------------------------------------------------------------------

# Helpful for large, uneven tables. Costs some ANALYZE time and catalog space.
default_statistics_target = 100

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

log_statement = 'none'

# Enable slow-query logging. Adjust upward if logs are noisy.
log_min_duration_statement = 500ms

# Helpful context for diagnosing production issues.
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_lock_waits = on
deadlock_timeout = 1s

#------------------------------------------------------------------------------
# LOCALE / TIME
#------------------------------------------------------------------------------

log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'

#------------------------------------------------------------------------------
# REPLICATION / ARCHIVING
#------------------------------------------------------------------------------

# Keep replication capability available unless you are sure you do not need it.
# These do not force you to run a replica.
max_wal_senders = 5
max_replication_slots = 5

# Leave archiving off unless you have configured archive_command / PITR.
archive_mode = off
